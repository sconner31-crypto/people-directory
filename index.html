<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>People Directory</title>

  <!-- Tabulator -->
  <link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 16px; }
    .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom: 12px; align-items:center; }
    input[type="search"] { padding: 8px 10px; min-width: 320px; }
    .muted { opacity: .75; font-size: 12px; }

    .person { display:flex; gap:10px; align-items:center; }
    .avatar, .avatar-fallback {
      width:36px; height:36px; border-radius:999px;
      display:inline-flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .avatar { object-fit:cover; }
    .avatar-fallback { font-size:12px; font-weight:600; background:#eee; }

    a { text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="controls">
    <input id="search" type="search" placeholder="Search name, title, expertise, supervisor..." />
    <span class="muted">Source: people-public.json</span>
  </div>

  <div id="people-table"></div>

  <script>
    const DATA_URL = "./people-public.json";

    function expertiseToText(expertiseArr){
      const arr = Array.isArray(expertiseArr) ? expertiseArr : [];
      return arr
        .map(x => (x && typeof x === "object") ? (x.Value || "") : String(x || ""))
        .filter(Boolean)
        .join("; ");
    }

    function initialsFromName(nameText){
      const txt = (nameText || "").replace(",", " ").trim();
      if(!txt) return "";
      const parts = txt.split(/\s+/).filter(Boolean);
      return parts.slice(0,2).map(p => (p[0] || "").toUpperCase()).join("");
    }

    const table = new Tabulator("#people-table", {
      layout: "fitColumns",
      responsiveLayout: "collapse",
      pagination: "local",
      paginationSize: 25,
      placeholder: "No people found",
      initialSort: [{ column: "name", dir: "asc" }],
      columns: [
        {
          title: "Person",
          field: "name",
          sorter: "string",
          headerFilter: true,
          formatter: (cell) => {
            const row = cell.getRow().getData();

            const profileUrl = (row.profileUrl || "").trim();
            const nameText = row.name || "";

            // Prefer public Imperial Profiles thumbnail, then O365 photo as fallback
            const photoUrl = (row.profilePhotoUrl || row.O365Photo || "").trim();

            const nameHtml = profileUrl
              ? `<a href="${profileUrl}" target="_blank" rel="noopener">${nameText}</a>`
              : nameText;

            const initials = initialsFromName(nameText);

            const imgHtml = photoUrl
              ? `<img class="avatar" src="${photoUrl}" alt=""
                   onerror="this.style.display='none'; this.parentElement.querySelector('.avatar-fallback').style.display='inline-flex';">`
              : "";

            const fallbackDisplay = photoUrl ? "none" : "inline-flex";

            return `
              <div class="person">
                <div style="position:relative;">
                  ${imgHtml}
                  <div class="avatar-fallback" style="display:${fallbackDisplay};">${initials}</div>
                </div>
                <div>${nameHtml}</div>
              </div>
            `;
          }
        },
        { title: "Job Title", field: "title", sorter: "string", headerFilter: true },
        {
          title: "Research Expertise",
          field: "expertise",
          sorter: (a,b) => expertiseToText(a).localeCompare(expertiseToText(b)),
          headerFilter: true,
          headerFilterFunc: (headerValue, rowValue) => {
            const hv = (headerValue || "").toLowerCase().trim();
            if(!hv) return true;
            return expertiseToText(rowValue).toLowerCase().includes(hv);
          },
          formatter: (cell) => expertiseToText(cell.getValue())
        },
        { title: "Year of Arrival", field: "year", sorter: "number", hozAlign: "right", headerFilter: true },
        { title: "Supervisor", field: "supervisor", sorter: "string", headerFilter: true }
      ]
    });

    // Load data (supports either [ ... ] or { body: [ ... ] } shapes)
    fetch(DATA_URL, { cache: "no-store" })
      .then(r => r.json())
      .then(data => {
        const rows = Array.isArray(data) ? data : (Array.isArray(data?.body) ? data.body : []);
        table.setData(rows);
      })
      .catch(err => {
        console.error("Failed to load JSON:", err);
        table.replaceData([]);
      });

    // Global search across key fields
    document.getElementById("search").addEventListener("input", (e) => {
      const q = (e.target.value || "").toLowerCase().trim();
      if (!q) { table.clearFilter(true); return; }

      table.setFilter((row) => {
        const hay = [
          row.name, row.email, row.title, row.supervisor,
          expertiseToText(row.expertise),
          row.year == null ? "" : String(row.year)
        ].join(" ").toLowerCase();

        return hay.includes(q);
      });
    });
  </script>
</body>
</html>
