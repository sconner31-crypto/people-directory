<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>People Directory (POC)</title>

  <link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 16px; }
    .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom: 12px; align-items:center; }
    input { padding: 8px; min-width: 280px; }
    .person { display:flex; gap:10px; align-items:center; }
    .avatar { width:36px; height:36px; border-radius:999px; object-fit:cover; }
    .muted { opacity: .75; font-size: 12px; }
  </style>
</head>
<body>

  <div class="controls">
    <input id="search" type="search" placeholder="Search name, title, expertise, supervisor..." />
    <span class="muted">POC</span>
  </div>

  <div id="people-table"></div>

  <script>
    const DATA_URL = "./people-public.json";

    function expertiseToText(expertiseArr){
      const arr = Array.isArray(expertiseArr) ? expertiseArr : [];
      return arr.map(x => x && x.Value ? x.Value : "").filter(Boolean).join("; ");
    }

    const table = new Tabulator("#people-table", {
      layout: "fitColumns",
      responsiveLayout: "collapse",
      pagination: "local",
      paginationSize: 25,
      placeholder: "No people found",
      initialSort: [{column:"name", dir:"asc"}],
      columns: [
        {
          title: "Person",
          field: "name",
          sorter: "string",
          headerFilter: true,
          formatter: (cell) => {
            const row = cell.getRow().getData();
            const img = row.photo ? `<img class="avatar" src="${row.photo}" alt="">` : "";
            return `<div class="person">${img}<div>${row.name || ""}</div></div>`;
          }
        },
        {title: "Job Title", field: "title", sorter: "string", headerFilter: true},
        {
          title: "Research Expertise",
          field: "expertise",
          sorter: (a,b) => expertiseToText(a).localeCompare(expertiseToText(b)),
          headerFilter: true,
          headerFilterFunc: (headerValue, rowValue) => {
            const hv = (headerValue || "").toLowerCase().trim();
            if(!hv) return true;
            return expertiseToText(rowValue).toLowerCase().includes(hv);
          },
          formatter: (cell) => expertiseToText(cell.getValue())
        },
        {title: "Year of Arrival", field: "year", sorter: "number", hozAlign:"right", headerFilter: true},
        {title: "Supervisor", field: "supervisor", sorter: "string", headerFilter: true},
      ],
    });

    fetch(DATA_URL)
      .then(r => r.json())
      .then(data => table.setData(data))
      .catch(err => { console.error(err); table.replaceData([]); });

    document.getElementById("search").addEventListener("input", (e) => {
      const q = (e.target.value || "").toLowerCase().trim();
      if (!q) { table.clearFilter(true); return; }

      table.setFilter((row) => {
        const hay = [
          row.name, row.email, row.title, row.supervisor,
          expertiseToText(row.expertise),
          row.year == null ? "" : String(row.year)
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });
    });
  </script>
</body>
</html>
