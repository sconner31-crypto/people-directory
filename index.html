<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>People Directory</title>

  <!-- Tabulator -->
  <link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

  <style>
    :root{
      --ic-blue: #003e74;      /* close to Imperial blue */
      --ic-blue-2: #1a5182;
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #5a5a5a;
      --line: #e6e6e6;
      --chip: #eef3f7;
      --chip-text: #123b5d;
      --focus: #2b7cff;
      --radius: 10px;
    }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
    }

    .wrap{
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .page-head{
      margin: 6px 0 16px;
      display:flex;
      gap:12px;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .page-head h1{
      font-size: 22px;
      margin: 0;
      letter-spacing: .2px;
      color: var(--ic-blue);
    }

    .page-head .meta{
      font-size: 12px;
      color: var(--muted);
    }

    /* Search bar styling (Imperial-ish) */
    .searchbar{
      display:flex;
      gap:10px;
      align-items:center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fafafa;
      margin-bottom: 14px;
    }

    .searchbar label{
      font-weight: 600;
      color: var(--ic-blue);
      font-size: 14px;
      white-space: nowrap;
    }

    .searchbar input[type="search"]{
      flex: 1;
      min-width: 220px;
      padding: 10px 12px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      outline: none;
    }

    .searchbar input[type="search"]:focus{
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(43,124,255,.18);
    }

    .btn{
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cfd8e3;
      background: white;
      cursor: pointer;
      font-weight: 600;
      color: var(--ic-blue);
    }
    .btn:focus{ outline: none; box-shadow: 0 0 0 3px rgba(43,124,255,.18); }

    /* Person row layout */
    .person{
      display:flex;
      gap: 14px;
      align-items: center;
    }

   .avatar, .avatar-fallback{
  width:72px;
  height:72px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex: 0 0 auto;
  background:#f5f7fa;
  border:1px solid #e2e8f0;
}

.avatar{
  object-fit:cover;
}


    .person-main{
      min-width: 0;
      display:flex;
      flex-direction: column;
      gap: 3px;
    }

    .person-name{
      font-weight: 800;
      line-height: 1.1;
      font-size: 14px;
    }

    .person-name a{
      color: var(--ic-blue);
      text-decoration: none;
    }
    .person-name a:hover{ text-decoration: underline; }

    .person-title{
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .chips{
      margin-top: 6px;
      display:flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip{
      background: var(--chip);
      color: var(--chip-text);
      border: 1px solid #d5e3ef;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }

    /* Tabulator: make it feel more like a list */
    .tabulator{
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .tabulator .tabulator-header{
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }
    .tabulator .tabulator-header .tabulator-col{
      background: #ffffff;
      font-weight: 800;
      color: var(--ic-blue);
    }
    .tabulator-row{
      border-bottom: 1px solid var(--line);
    }
    .tabulator-row:last-child{
      border-bottom: none;
    }
    .tabulator .tabulator-footer{
      border-top: 1px solid var(--line);
      background: #fff;
    }

    /* Responsive: hide some columns on small screens */
    @media (max-width: 720px){
      .page-head h1{ font-size: 18px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="page-head">
      <h1>People directory</h1>
      <div class="meta">Data source: <code>people-public.json</code></div>
    </div>

    <div class="searchbar">
      <label for="search">Search</label>
      <input id="search" type="search" placeholder="Name, job title, expertise, supervisor…" />
      <button id="clear" class="btn" type="button">Clear</button>
    </div>

    <div id="people-table"></div>
  </div>

  <script>
    const DATA_URL = "./people-public.json";

    function expertiseToArray(expertise){
      if (expertise == null) return [];
      if (Array.isArray(expertise)) return expertise;

      if (typeof expertise === "string") {
        const s = expertise.trim();
        if (!s) return [];
        // Might be stringified JSON
        if (s.startsWith("[") || s.startsWith("{")) {
          try { return expertiseToArray(JSON.parse(s)); } catch { return s.split(";").map(x=>x.trim()).filter(Boolean); }
        }
        // "Choice 1; Choice 2"
        return s.split(";").map(x=>x.trim()).filter(Boolean);
      }

      if (typeof expertise === "object") return [expertise];
      return [String(expertise)];
    }

    function expertiseToText(expertise){
      const arr = expertiseToArray(expertise);
      return arr.map(x => {
        if (x == null) return "";
        if (typeof x === "string") return x;
        if (typeof x === "object") return x.Value || x.value || "";
        return String(x);
      }).filter(Boolean).join("; ");
    }

    function expertiseToChips(expertise){
      const arr = expertiseToArray(expertise).map(x => {
        if (x == null) return "";
        if (typeof x === "string") return x;
        if (typeof x === "object") return x.Value || x.value || "";
        return String(x);
      }).filter(Boolean);

      return arr.map(v => `<span class="chip">${escapeHtml(v)}</span>`).join("");
    }

    function initialsFromName(nameText){
      const txt = (nameText || "").replace(",", " ").trim();
      if(!txt) return "";
      const parts = txt.split(/\s+/).filter(Boolean);
      return parts.slice(0,2).map(p => (p[0] || "").toUpperCase()).join("");
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    const table = new Tabulator("#people-table", {
      layout: "fitColumns",
      responsiveLayout: "collapse",
      pagination: "local",
      paginationSize: 25,
      placeholder: "No people found",
      initialSort: [{ column: "name", dir: "asc" }],
      columns: [
        {
          title: "Person",
          field: "name",
          sorter: "string",
          headerFilter: true,
          widthGrow: 2,
          formatter: (cell) => {
            const row = cell.getRow().getData();
            const profileUrl = (row.profileUrl || "").trim();
            const nameText = row.name || "";

            const photoUrl = (row.profilePhotoUrl || row.O365Photo || "").trim();
            const initials = initialsFromName(nameText);

            const nameHtml = profileUrl
              ? `<a href="${escapeHtml(profileUrl)}" target="_blank" rel="noopener">${escapeHtml(nameText)}</a>`
              : escapeHtml(nameText);

            const titleHtml = row.title ? `<div class="person-title">${escapeHtml(row.title)}</div>` : "";

            const chipsHtml = expertiseToChips(row.expertise);
            const chipsBlock = chipsHtml ? `<div class="chips">${chipsHtml}</div>` : "";

            const imgHtml = photoUrl
              ? `<img class="avatar" src="${escapeHtml(photoUrl)}" alt=""
                   onerror="this.style.display='none'; this.parentElement.querySelector('.avatar-fallback').style.display='inline-flex';">`
              : "";

            const fallbackDisplay = photoUrl ? "none" : "inline-flex";

            return `
              <div class="person">
                <div style="position:relative;">
                  ${imgHtml}
                  <div class="avatar-fallback" style="display:${fallbackDisplay};">${escapeHtml(initials)}</div>
                </div>
                <div class="person-main">
                  <div class="person-name">${nameHtml}</div>
                  ${titleHtml}
                  ${chipsBlock}
                </div>
              </div>
            `;
          }
        },
        { title: "Supervisor", field: "supervisor", sorter: "string", headerFilter: true },
        {
          title: "Year",
          field: "year",
          sorter: "number",
          hozAlign: "right",
          headerFilter: true
        }
      ]
    });

    function setGlobalSearch(q){
      const query = (q || "").toLowerCase().trim();
      if (!query) { table.clearFilter(true); return; }

      table.setFilter((row) => {
        const hay = [
          row.name, row.email, row.title, row.supervisor,
          expertiseToText(row.expertise),
          row.year == null ? "" : String(row.year)
        ].join(" ").toLowerCase();

        return hay.includes(query);
      });
    }

    document.getElementById("search").addEventListener("input", (e) => setGlobalSearch(e.target.value));
    document.getElementById("clear").addEventListener("click", () => {
      document.getElementById("search").value = "";
      setGlobalSearch("");
      document.getElementById("search").focus();
    });

    fetch(DATA_URL, { cache: "no-store" })
      .then(r => r.json())
      .then(data => {
        const rows = Array.isArray(data) ? data : (Array.isArray(data?.body) ? data.body : []);
        table.setData(rows);
      })
      .catch(err => {
        console.error("Failed to load JSON:", err);
        table.replaceData([]);
      });
  </script>
</body>
</html>
